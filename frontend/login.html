<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In &mdash; Snovasys Secure Bank</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark navbar-bank py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-shield-lock-fill fs-4 me-2 text-warning"></i>
        <span>Snovasys Secure Bank</span>
      </a>
      <a href="register.html" class="btn btn-sm btn-outline-light">Need an Account? Register</a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card bank-card p-4">
          <div class="text-center mb-4">
            <h4 class="fw-bold mb-1">Account Sign In</h4>
            <p class="text-muted small">Enter your credentials to access your secure portal</p>
          </div>

          <div id="authAlert" class="alert d-none"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label small fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" placeholder="name@bank.com" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label small fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" class="btn btn-bank-primary w-100 py-2 mb-3">
              Sign In
            </button>
          </form>

          <!-- Quick Fill Demo Accounts -->
          <div class="border-top pt-3 text-center">
            <small class="text-muted d-block mb-2 fw-semibold">Click to autofill test credentials:</small>
            <div class="btn-group btn-group-sm w-100" role="group">
              <button class="btn btn-outline-danger btn-demo-fill" data-email="admin@bank.com" data-pass="Admin@123">
                Admin
              </button>
              <button class="btn btn-outline-primary btn-demo-fill" data-email="alice@bank.com" data-pass="Alice@123">
                Alice
              </button>
              <button class="btn btn-outline-info btn-demo-fill" data-email="bob@bank.com" data-pass="Bob@123">
                Bob
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
